name: release

on:
  push:
    tags: ["flupcode-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build. A draft is created; nothing is published unless publish is set."
        required: true
      publish:
        description: "Publish the release as latest. Leave off for a dry run that stays a draft."
        type: boolean
        default: false

permissions:
  contents: write

env:
  # A tag push names the release by its tag; a dispatch names it by the input. Every job and every
  # command reads this one value, so a dry-run dispatch never touches another release by accident.
  # Read through `github.event.inputs` so a push, which has no inputs context, is still safe.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}

# One release, and every byte uploaded once.
#
# The shape used to be: three jobs build and stash their output as workflow artifacts, then a fourth
# downloads all of it (~1.3 GB) and uploads it to the release. Two moves for every byte, through a
# single runner, so the whole release waited on one upload at a time — and when GitHub's asset
# endpoint is slow, on the slowest file of the fifteen. A release that normally took six minutes took
# fifty-two on 1.12.0, with two files crawling at ~100 KB/s.
#
# Now each job publishes what it built, in parallel, straight to the release. The release is created
# as a draft first, so a half-built one is never visible: `releases/latest` keeps pointing at the
# previous release until the verify job has checked that every installer the update manifests name is
# actually there, and only then is it published.
#
# Every upload goes through `.github/scripts/release-upload.sh`, which retries: the asset endpoint
# fails about a quarter of attempts with HTTP 500/504 and crawls at ~100 KB/s when it does, which is
# what left 1.12.0's draft missing its largest installers. Each job uploads its own files and the
# retries are per file, so one slow installer no longer holds the whole release.

jobs:
  # The release exists before anything is uploaded to it, and stays a draft until it is complete.
  open:
    runs-on: ubuntu-latest
    steps:
      # `gh release create --verify-tag` reads the local tag, and the notes are generated from the
      # history behind it: without a checkout this fails before it creates anything (which is how the
      # first run of this workflow went, loudly and in seven seconds).
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Open the release as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; reusing it"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FlupCode $RELEASE_TAG" \
              --generate-notes \
              --draft \
              --verify-tag
          else
            # A dispatch has no tag yet: create one at the commit this run is building.
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FlupCode $RELEASE_TAG" \
              --generate-notes \
              --draft \
              --target "$GITHUB_SHA"
          fi

  web:
    needs: [open]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --cwd packages/harness typecheck

      - name: Test
        run: bun run --cwd packages/harness test

      - name: Build
        run: bun run --cwd packages/harness build

      - name: Package web bundle
        run: |
          cd packages/harness/dist
          zip -r ../../../flupcode-web.zip .

      - name: Publish web bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release-upload.sh "$RELEASE_TAG" flupcode-web.zip

  cli:
    needs: [open]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: |
          bun run --cwd packages/flupcode-cli typecheck
          bun run --cwd packages/flupcode-cli test

      - name: Compile flupcode binaries
        run: |
          mkdir -p cli
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            extension=""
            if [ "$target" = "windows-x64" ]; then extension=".exe"; fi
            bun build packages/flupcode-cli/src/index.ts --compile --target="bun-$target" \
              --outfile "cli/flupcode-$target$extension"
          done

      - name: Publish CLI binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release-upload.sh "$RELEASE_TAG" cli/*

  desktop:
    needs: [open]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck desktop
        run: bun run --cwd packages/harness-desktop typecheck

      # electron-builder's rpm target shells out to fpm, which needs the rpm binary on the runner.
      - name: Install rpm tooling
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package desktop
        run: bun run --cwd packages/harness-desktop dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish this platform's installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(packages/harness-desktop/release/*.dmg packages/harness-desktop/release/*.zip \
                 packages/harness-desktop/release/*.exe packages/harness-desktop/release/*.AppImage \
                 packages/harness-desktop/release/*.deb packages/harness-desktop/release/*.rpm \
                 packages/harness-desktop/release/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::nothing was packaged, so this release would ship no installer for ${{ matrix.os }}"
            exit 1
          fi
          bash .github/scripts/release-upload.sh "$RELEASE_TAG" "${files[@]}"

  # The release is only worth publishing if auto-update can find what it is told to fetch: every file
  # the manifests name has to be an asset, or the app would download a 404 on its next check.
  verify:
    needs: [web, cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Read the update manifests off the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p manifest
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'latest*.yml' --dir manifest

      - name: Every file they name is an asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort > assets.txt
          grep -h '^  - url: ' manifest/*.yml | sed 's/^  - url: //' | tr -d '\r' | sort -u > named.txt
          if [ ! -s named.txt ]; then
            echo "::error::no update manifest named a file, so nothing was packaged"
            exit 1
          fi
          while read -r file; do
            grep -qxF "$file" assets.txt || { echo "::error::$file is missing from the release, and latest*.yml points at it"; exit 1; }
          done < named.txt
          # The CLI binaries are not in a manifest: they are what the install docs tell people to curl.
          for file in flupcode-darwin-arm64 flupcode-darwin-x64 flupcode-linux-x64 flupcode-linux-arm64 flupcode-windows-x64.exe flupcode-web.zip; do
            grep -qxF "$file" assets.txt || { echo "::error::$file is missing from the release"; exit 1; }
          done
          cat assets.txt

  # Draft until here, so a release that failed halfway is never what `releases/latest` serves.
  publish:
    needs: [verify]
    # A dry-run dispatch stops before this: the release stays a draft, so nothing reaches
    # `releases/latest`. A tag push always publishes.
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
