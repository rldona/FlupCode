name: harness

# No `paths` filter on the triggers: `gate` is the required check on `power`, and a required check
# must report on every pull request. The `changes` job decides what actually needs to run.
on:
  push:
    branches: [power]
  pull_request:
    branches: [power]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      harness: ${{ steps.filter.outputs.harness }}
      engine: ${{ steps.filter.outputs.engine }}
      inventory: ${{ steps.filter.outputs.inventory }}
    steps:
      # Fails closed: whenever the changed files cannot be listed completely, everything runs.
      - name: Detect changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          all() {
            echo "harness=true" >> "$GITHUB_OUTPUT"
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "inventory=$([ "$EVENT" = pull_request ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "Running everything: $1"
            exit 0
          }
          # The files API stops at 3000 entries and compare at 300: a full page means a partial list.
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || all "cannot list PR files"
              [ "$(printf '%s\n' "$files" | grep -c .)" -ge 3000 ] && all "PR lists 3000+ files"
              ;;
            push)
              case "$BEFORE" in ""|0000000000000000000000000000000000000000) all "no previous commit" ;; esac
              files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || all "cannot compare commits"
              [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ] && all "push lists 300+ files"
              ;;
            *) all "event $EVENT" ;;
          esac
          matches() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          echo "harness=$(matches '^(packages/(harness|harness-desktop|harness-server|remote|relay|flupcode-cli|engine-contract|sdk|session-ui|ui|core)/|package\.json$|bun\.lock$|\.github/workflows/harness\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "engine=$(matches '^(packages/(core|opencode|llm|server|protocol|schema|client|plugin|sdk|session-ui|engine-contract|remote)/|packages/harness/src/engine/|docs/upstream-inventory\.txt$|package\.json$|bun\.lock$|\.github/workflows/harness\.yml$)')" >> "$GITHUB_OUTPUT"
          inventory=false
          [ "$EVENT" = pull_request ] && inventory=$(matches '^(packages/|docs/upstream-inventory\.txt$|script/upstream-inventory\.ts$|\.github/workflows/harness\.yml$)')
          echo "inventory=$inventory" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    # Pinned, not `ubuntu-latest`: the label migrates to Ubuntu 26 in October 2026 and a build that
    # changes its own OS on a calendar date is a build that breaks on one.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: |
          bun run --cwd packages/harness typecheck
          bun run --cwd packages/harness-desktop typecheck
          bun run --cwd packages/harness-server typecheck
          bun run --cwd packages/remote typecheck
          bun run --cwd packages/relay typecheck
          bun run --cwd packages/flupcode-cli typecheck

      - name: Install Playwright browsers
        run: cd packages/harness && bunx playwright install --with-deps chromium

      - name: Test remote control
        env:
          FLUPCODE_REQUIRE_BROWSER: "1"
        run: |
          bun run --cwd packages/remote test
          bun run --cwd packages/relay test
          bun run --cwd packages/flupcode-cli test
          bun run --cwd packages/harness-server test
          bun run --cwd packages/harness-desktop test

      - name: Test harness
        run: bun run --cwd packages/harness test

      - name: Build
        run: bun run --cwd packages/harness build

      - name: E2E
        run: bun run --cwd packages/harness test:e2e

      # The app against a real OpenCode 2 engine (V2-43): the pinned binary with the stub model and no
      # mocked routes. Send, stream, a permission, a question, the MCP list and the server-side queue.
      - name: E2E against OpenCode 2
        env:
          CI: "1"
        run: bun run --cwd packages/harness test:e2e:engine

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: flupcode-web
          path: packages/harness/dist
          retention-days: 14

  # Our own tests inside the upstream packages (memory, plan_exit, message compat, the permission
  # floor, config reload...). Upstream's workflow for them is gated to anomalyco/opencode, so without
  # this job they never ran here. The list is the upstream inventory, which CI already keeps
  # complete: every test file of ours in an upstream package is declared there. Upstream's own
  # suites are not run: several need recordings or a machine setup this runner does not have.
  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test our engine changes
        run: |
          set -euo pipefail
          tests=$(grep -E '^packages/[^/]+/.+\.test\.tsx?$' docs/upstream-inventory.txt)
          [ -n "$tests" ] || { echo "no engine tests declared in docs/upstream-inventory.txt"; exit 1; }
          for package in $(printf '%s\n' "$tests" | cut -d/ -f2 | sort -u); do
            files=$(printf '%s\n' "$tests" | grep "^packages/$package/" | sed "s#^packages/$package/##")
            echo "::group::packages/$package"
            (cd "packages/$package" && bun test --timeout 30000 $files)
            echo "::endgroup::"
          done

      # The engine as FlupCode drives it: a real `opencode serve` from this checkout, isolated, with a
      # stub model, checked against the recorded fixtures (V2-02), and with FlupCode's engine plugins
      # installed, each one checked by what it leaves behind (V2-03).
      - name: Engine contract
        env:
          CI: "1"
        run: |
          bun run --cwd packages/engine-contract typecheck
          bun run --cwd packages/engine-contract test
          (cd packages/harness-server && FLUPCODE_CONTRACT_LINE=v1 bun test src/runner.engine.test.ts --timeout 120000)

      # The same flows and FlupCode's OpenCode 2 adapter against a real 2.x engine: the pinned sandbox
      # binary, fetched from the npm registry and checked against its integrity (V2-05, V2-06, V2-20
      # to V2-26).
      - name: OpenCode 2 contract and adapter
        env:
          CI: "1"
          FLUPCODE_CONTRACT_LINE: v2
        run: |
          bun run --cwd packages/engine-contract test:v2
          (cd packages/harness && bun test src/engine --timeout 60000)
          (cd packages/harness-server && bun test src/engine-config.engine.test.ts src/runner.engine.test.ts --timeout 120000)

  inventory:
    needs: changes
    if: needs.changes.outputs.inventory == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch upstream mirror
        # The inventory is defined against the mirror, which a PR checkout does not bring.
        run: git fetch origin dev:refs/remotes/origin/dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # No install: the script only shells out to git.
      - name: Check inventory
        env:
          INVENTORY_SINCE: ${{ github.event.pull_request.base.sha }}
        run: bun script/upstream-inventory.ts

  # The one required check on `power`. A job skipped because its paths did not change is a pass; a
  # failed or cancelled one, or a `changes` job that could not decide, is not.
  gate:
    needs: [changes, build, engine, inventory]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          ENGINE: ${{ needs.engine.result }}
          INVENTORY: ${{ needs.inventory.result }}
        run: |
          echo "changes=$CHANGES build=$BUILD engine=$ENGINE inventory=$INVENTORY"
          [ "$CHANGES" = success ] || exit 1
          for result in "$BUILD" "$ENGINE" "$INVENTORY"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
