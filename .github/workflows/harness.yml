name: harness

# No `paths` filter on the triggers: `gate` is the required check on `main`, and a required check
# must report on every pull request. The `changes` job decides what actually needs to run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      harness: ${{ steps.filter.outputs.harness }}
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      # Fails closed: whenever the changed files cannot be listed completely, everything runs.
      - name: Detect changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          all() {
            echo "harness=true" >> "$GITHUB_OUTPUT"
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "Running everything: $1"
            exit 0
          }
          # The files API stops at 3000 entries and compare at 300: a full page means a partial list.
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || all "cannot list PR files"
              [ "$(printf '%s\n' "$files" | grep -c .)" -ge 3000 ] && all "PR lists 3000+ files"
              ;;
            push)
              case "$BEFORE" in ""|0000000000000000000000000000000000000000) all "no previous commit" ;; esac
              files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || all "cannot compare commits"
              [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ] && all "push lists 300+ files"
              ;;
            *) all "event $EVENT" ;;
          esac
          matches() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          echo "harness=$(matches '^(packages/(harness|harness-desktop|harness-server|remote|relay|flupcode-cli|engine-contract)/|package\.json$|bun\.lock$|script/opencode-pin\.ts$|docs/opencode-boundary\.txt$|\.github/workflows/harness\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "engine=$(matches '^(packages/(engine-contract|remote|harness-server)/|packages/harness/src/engine/|package\.json$|bun\.lock$|\.github/workflows/harness\.yml$)')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    # Pinned, not `ubuntu-latest`: the label migrates to Ubuntu 26 in October 2026 and a build that
    # changes its own OS on a calendar date is a build that breaks on one.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      # One OpenCode 2 version for the binary and its client, and no new FlupCode file reaching the
      # vendored upstream packages (ADR-0027).
      - name: OpenCode pin and boundary
        run: bun script/opencode-pin.ts

      - name: Typecheck
        run: |
          bun run --cwd packages/harness typecheck
          bun run --cwd packages/harness-desktop typecheck
          bun run --cwd packages/harness-server typecheck
          bun run --cwd packages/remote typecheck
          bun run --cwd packages/relay typecheck
          bun run --cwd packages/flupcode-cli typecheck

      - name: Install Playwright browsers
        run: cd packages/harness && bunx playwright install --with-deps chromium

      - name: Test remote control
        env:
          FLUPCODE_REQUIRE_BROWSER: "1"
        run: |
          bun run --cwd packages/remote test
          bun run --cwd packages/relay test
          bun run --cwd packages/flupcode-cli test
          bun run --cwd packages/harness-server test
          bun run --cwd packages/harness-desktop test

      - name: Test harness
        run: bun run --cwd packages/harness test

      - name: Build
        run: bun run --cwd packages/harness build

      - name: E2E
        run: bun run --cwd packages/harness test:e2e

      # The app against a real OpenCode 2 engine (V2-43): the pinned binary with the stub model and no
      # mocked routes. Send, stream, a permission, a question, the MCP list and the server-side queue.
      - name: E2E against OpenCode 2
        env:
          CI: "1"
        run: bun run --cwd packages/harness test:e2e:engine

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: flupcode-web
          path: packages/harness/dist
          retention-days: 14

  # FlupCode against the real engine: the engine-contract suite and the adapters' live tests, on the
  # pinned OpenCode 2 binary (ADR-0027). A pin bump runs this.
  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      # The engine as FlupCode drives it, and FlupCode's OpenCode 2 adapter, against a real engine: the
      # pinned binary, fetched from the npm registry and checked against its integrity, isolated, with
      # a stub model and FlupCode's plugins installed (V2-05, V2-06, V2-20 to V2-26).
      - name: OpenCode 2 contract and adapter
        env:
          CI: "1"
          FLUPCODE_CONTRACT_LINE: v2
        run: |
          bun run --cwd packages/engine-contract typecheck
          bun run --cwd packages/engine-contract test
          (cd packages/harness && bun test src/engine --timeout 60000)
          (cd packages/harness-server && bun test src/engine-config.engine.test.ts src/runner.engine.test.ts --timeout 120000)

  # The one required check on `main`. A job skipped because its paths did not change is a pass; a
  # failed or cancelled one, or a `changes` job that could not decide, is not.
  gate:
    needs: [changes, build, engine]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          ENGINE: ${{ needs.engine.result }}
        run: |
          echo "changes=$CHANGES build=$BUILD engine=$ENGINE"
          [ "$CHANGES" = success ] || exit 1
          for result in "$BUILD" "$ENGINE"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
