<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Repository cover / GitHub social preview (1280x640): the app icon, the name and the app.
     Rendered into cover.png by script/make-cover.sh. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #fff; position: relative;
    background:
      radial-gradient(900px 600px at 105% 105%, rgba(255, 90, 38, .45), transparent 62%),
      radial-gradient(700px 500px at -10% -20%, rgba(255, 90, 38, .18), transparent 60%),
      linear-gradient(135deg, #111215 0%, #1a1b20 60%, #1c1410 100%);
  }
  .brand { position: absolute; left: 76px; top: 86px; width: 540px; }
  .icon { width: 132px; height: 132px; display: block; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .45)); }
  h1 { font-size: 92px; line-height: 1; letter-spacing: -2.5px; margin-top: 34px; font-weight: 800; }
  .tag { font-size: 32px; line-height: 1.3; margin-top: 22px; color: #ffd9c7; font-weight: 500; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 34px; white-space: nowrap; }
  .chip { font-size: 17px; padding: 6px 13px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.28); background: rgba(255,255,255,.07); color: #fbeee8; }
  .shot {
    position: absolute; left: 640px; top: 96px; width: 760px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 40px 80px rgba(0, 0, 0, .6), 0 0 0 1.5px rgba(255, 255, 255, .14);
    background: #1a1b1f;
  }
  /* The screenshot already has its own traffic lights, so no extra title bar. */
  .shot img { display: block; width: 860px; }
</style>
</head>
<body>
  <div class="brand">
    <img class="icon" src="../../packages/harness/public/icon-512.png" alt="FlupCode icon">
    <h1>FlupCode</h1>
    <p class="tag">The web and desktop harness<br>for OpenCode.</p>
    <div class="chips">
      <span class="chip">Open source</span><span class="chip">macOS</span><span class="chip">Windows</span><span class="chip">Linux</span>
    </div>
  </div>
  <div class="shot">
    <img src="flupcode-cover-new.png" alt="FlupCode">
  </div>
</body>
</html>
