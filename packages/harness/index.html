<!doctype html>
<html lang="en" style="background-color: #ffffff">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <script>
      // Apply the saved theme before the first paint. The dark theme is otherwise applied when the
      // app mounts, so the white fallback background flashes on reload, clearly visible in Electron.
      ;(() => {
        try {
          const stored = JSON.parse(localStorage.getItem("flupcode.theme") || "null")
          const mode = stored === "dark" || stored === "light" ? stored : "system"
          const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("fc-dark", dark)
          document.documentElement.style.backgroundColor = dark ? "#0f0f0f" : "#ffffff"
        } catch {}
      })()
    </script>
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="%BASE_URL%icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FlupCode" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FlupCode</title>
    <script src="%BASE_URL%boot.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="/src/entry.tsx" type="module"></script>
  </body>
</html>
